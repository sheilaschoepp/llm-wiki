[tool.ruff]
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "E501", "F", "I", "W505"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 72
max-line-length = 100

[tool.ruff.format]
quote-style = "single"
line-ending = "lf"

[tool.docformatter]
recursive = true
wrap-summaries = 72
wrap-descriptions = 72
make-summary-multi-line = true
pre-summary-newline = true
close-quotes-on-newline = true
